<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Relational Tables — Etymological Tree Workspace</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d25; --line:#2a2e38;
    --text:#e8e8ea; --muted:#8a8d98; --err:#e8746a; --accent:#8b7fe8;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  #container{display:grid; grid-template-columns:280px 1fr; min-height:100vh;}

  #sidebar {
    background:var(--panel); border-right:1px solid var(--line); padding:20px;
    display:flex; flex-direction:column; gap:20px; overflow-y:auto;
  }
  #main-content { padding:20px; display:flex; flex-direction:column; gap:20px; }

  h1{font-size:16px; font-weight:600; margin:0 0 4px;}
  h2{font-size:12px; font-weight:600; color:var(--muted); margin:0 0 8px; text-transform:uppercase; letter-spacing:0.5px;}
  .sub{font-size:12px; color:var(--muted); margin-bottom:4px;}

  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; color:var(--muted);}
  .field input[type=file]{font-size:12px; color:var(--text); width:100%;}

  button{
    font-size:12px; color:var(--text); background:#242832; border:1px solid var(--line);
    border-radius:6px; padding:8px 12px; cursor:pointer; width:100%; text-align:left;
  }
  button:hover{border-color:var(--muted); background:#2a2f3b;}

  a{color:var(--accent);}
  a.nav-link{font-size:12px; color:var(--text); text-decoration:none; display:block; padding:8px 12px; border:1px solid var(--line); border-radius:6px;}
  a.nav-link:hover{border-color:var(--muted); background:#2a2f3b;}

  #status{font-size:12px; min-height:16px;}
  #status.error{color:var(--err);}
  #status.ok{color:#6fcf97;}

  .table-block{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; overflow-x:auto;}
  .table-block h2{margin-bottom:12px;}
  table{border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap;}
  th, td{padding:6px 10px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel);}
  tr:hover td{background:#20242e;}
  .empty-note{color:var(--muted); font-size:12px;}
</style>
</head>
<body>
<div id="container">
  <div id="sidebar">
    <div>
      <h1>Relational tables</h1>
      <div class="sub">Words &amp; edges derived from an imported CSV.</div>
    </div>

    <div class="field">
      <label>Flat CSV (id, word, parent_id, meaning, category, tags)</label>
      <input type="file" id="csvFile" accept=".csv">
    </div>

    <button id="loadSample">⚡ Load Sample Dataset</button>

    <div id="status"></div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <a class="nav-link" href="index.html">&larr; Back to graph view</a>
    </div>
  </div>

  <div id="main-content">
    <div class="table-block">
      <h2>Words Table</h2>
      <div id="wordsTableWrap"><div class="empty-note">Upload a CSV, or click "Load Sample Dataset".</div></div>
    </div>
    <div class="table-block">
      <h2>Relational (Edges) Table</h2>
      <div id="edgesTableWrap"><div class="empty-note">Upload a CSV, or click "Load Sample Dataset".</div></div>
    </div>
  </div>
</div>

<script>
const SAMPLE_CSV =
`id,word,parent_id,meaning,category,tags
ROOT,*PIE,,Proto-Indo-European common ancestor,,PIE-root
PIE_PTER,*péth₂r̥,ROOT,wing / feather,Nature,PIE-root
GK_PTERON,πτερόν,PIE_PTER,wing / feather,Nature,Greek
LAT_PENNA,penna,PIE_PTER,feather / wing,Nature,Latin
SP_PENA,pluma,LAT_PENNA,feather,Nature,Spanish
TOC_PACE,päts,PIE_PTER,wing,Nature,Tocharian-B
PIE_AKW,*h₃ekʷ-,ROOT,eye / see,Body,PIE-root
GK_OPS,ὄψ,PIE_AKW,eye / face,Body,Greek
LAT_OCULUS,oculus,PIE_AKW,eye,Body,Latin
SP_OJO,ojo,LAT_OCULUS,eye,Body,Spanish
OHG_AUGE,ouga,PIE_AKW,eye,Body,OHG
GER_AUGE,Auge,OHG_AUGE,eye,Body,German
TOC_AK,ak,PIE_AKW,eye,Body,Tocharian-A
PIE_KWON,*ḱwón-,ROOT,dog,Animals,PIE-root
GK_KUON,κύων,PIE_KWON,dog,Animals,Greek
LAT_CANIS,canis,PIE_KWON,dog,Animals,Latin
SP_CAN,can,LAT_CANIS,dog / hound,Animals,Spanish
TOC_KU,ku,PIE_KWON,dog,Animals,Tocharian-A
PIE_MATR,*méh₂tēr,ROOT,mother,Family,PIE-root
GK_METER,μήτηρ,PIE_MATR,mother,Family,Greek
LAT_MATER,mater,PIE_MATR,mother,Family,Latin
SP_MADRE,madre,LAT_MATER,mother,Family,Spanish
TOC_MACER,mācer,PIE_MATR,mother,Family,Tocharian-B
OHG_MUOTER,muoter,PIE_MATR,mother,Family,OHG
GER_MUTTER,Mutter,OHG_MUOTER,mother,Family,German
PIE_ED,*h₁ed-,ROOT,to eat,Food,PIE-root
LAT_EDERE,edere,PIE_ED,to eat,Food,Latin
LAT_ESCA,esca,LAT_EDERE,food / bait,Food,Latin
SP_COMER,comer,LAT_EDERE,to eat,Food,Spanish
GK_EDO,ἔδω,PIE_ED,to eat,Food,Greek
TOC_IT,it-,PIE_ED,to eat,Food,Tocharian-A
PIE_NEBH,*nébʰos,ROOT,sky / cloud,Nature,PIE-root
GK_NEPHOS,νέφος,PIE_NEBH,cloud,Nature,Greek
LAT_NEBULA,nebula,PIE_NEBH,mist / fog,Nature,Latin
SP_NIEBLA,niebla,LAT_NEBULA,fog,Nature,Spanish
TOC_NEPO,nepo,PIE_NEBH,sky,Nature,Tocharian-B
PIE_TREYES,*tréyes,ROOT,three,Numbers,PIE-root
GK_TREIS,τρεῖς,PIE_TREYES,three,Numbers,Greek
LAT_TRES,tres,PIE_TREYES,three,Numbers,Latin
TOC_TRI,trai,PIE_TREYES,three,Numbers,Tocharian-A
`;

function setStatus(msg, kind){
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = kind || "";
}

document.getElementById("csvFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {header:true, dynamicTyping:true, skipEmptyLines:true, complete: r => build(r.data)});
});

document.getElementById("loadSample").addEventListener("click", () => {
  Papa.parse(SAMPLE_CSV, {header:true, dynamicTyping:true, skipEmptyLines:true, complete: r => build(r.data)});
});

// Mirrors relational_database.py: builds a normalized "words" table (one row
// per unique id) and an "edges" table (parent_id -> id relationships) from a
// flat CSV of shape id, word, parent_id, meaning, category, tags.
//
// Builds a Words table containing one entity row per unique CSV id
// (node_type=WORD), plus synthetic entity rows for each distinct language
// (tags), semantic category (category), and semantic subcategory (the
// meaning of each root-level concept, i.e. a direct child of a root/blank
// parent_id row). All entity kinds share one word_id space so edges can
// point at any of them. The Edges table then expresses several kinds of
// relationship_type between those entities:
//   DEVELOPED_INTO - word-to-word lineage (parent_id -> id)
//   HAS_WORD / TAGGED_AS - language <-> word membership
//   RESOLVES_INTO - semantic category -> subcategory
//   CONNECTED_TO - synchronic siblings (same parent_id AND same tags)
function isBlank(v){ return v === undefined || v === null || v === ""; }

function buildRelationalTables(rows){
  const csvRows = rows.filter(r => !isBlank(r.id));
  const words = [];
  const wordIdByCsvId = new Map();
  csvRows.forEach(r => {
    const wordId = words.length + 1;
    wordIdByCsvId.set(String(r.id), wordId);
    words.push({ word_id: wordId, node_type: "WORD", id: r.id, word: r.word,
                  meaning: r.meaning, category: r.category, tags: r.tags });
  });

  const tagsByCsvId = new Map(csvRows.map(r => [String(r.id), r.tags]));

  const languageWordId = new Map();
  [...new Set(csvRows.map(r => r.tags).filter(t => !isBlank(t)))].sort().forEach(tag => {
    const wordId = words.length + 1;
    languageWordId.set(tag, wordId);
    words.push({ word_id: wordId, node_type: "LANGUAGE", id: "", word: tag,
                  meaning: "", category: "", tags: "" });
  });

  const categoryWordId = new Map();
  [...new Set(csvRows.map(r => r.category).filter(c => !isBlank(c)))].sort().forEach(cat => {
    const wordId = words.length + 1;
    categoryWordId.set(cat, wordId);
    words.push({ word_id: wordId, node_type: "CATEGORY", id: "", word: cat,
                  meaning: "", category: "", tags: "" });
  });

  const rootIds = new Set(csvRows.filter(r => isBlank(r.parent_id)).map(r => String(r.id)));
  const rootConcepts = csvRows.filter(r => rootIds.has(String(r.parent_id)));
  const subcategoryWordId = new Map();
  rootConcepts.forEach(r => {
    if (subcategoryWordId.has(r.meaning)) return;
    const wordId = words.length + 1;
    subcategoryWordId.set(r.meaning, wordId);
    words.push({ word_id: wordId, node_type: "SUBCATEGORY", id: "", word: r.meaning,
                  meaning: "", category: r.category, tags: "" });
  });

  const edges = [];
  const addEdge = (sourceWordId, targetWordId, relationshipType, isDiachronic) => {
    edges.push({ edge_id: edges.length + 1, source_word_id: sourceWordId,
                 target_word_id: targetWordId, relationship_type: relationshipType,
                 is_diachronic: isDiachronic });
  };

  // DEVELOPED_INTO: word-to-word lineage.
  csvRows.forEach(r => {
    if (isBlank(r.parent_id)) return;
    const sourceWordId = wordIdByCsvId.get(String(r.parent_id));
    const targetWordId = wordIdByCsvId.get(String(r.id));
    if (sourceWordId === undefined || targetWordId === undefined) return;
    addEdge(sourceWordId, targetWordId, "DEVELOPED_INTO", tagsByCsvId.get(String(r.parent_id)) !== r.tags);
  });

  // HAS_WORD (language -> word) and TAGGED_AS (word -> language).
  csvRows.forEach(r => {
    if (isBlank(r.tags)) return;
    const langWordId = languageWordId.get(r.tags);
    const wordId = wordIdByCsvId.get(String(r.id));
    addEdge(langWordId, wordId, "HAS_WORD", null);
    addEdge(wordId, langWordId, "TAGGED_AS", null);
  });

  // RESOLVES_INTO: semantic category -> subcategory.
  const seenCategoryMeaning = new Set();
  rootConcepts.forEach(r => {
    const key = r.category + "||" + r.meaning;
    if (seenCategoryMeaning.has(key)) return;
    seenCategoryMeaning.add(key);
    addEdge(categoryWordId.get(r.category), subcategoryWordId.get(r.meaning), "RESOLVES_INTO", null);
  });

  // CONNECTED_TO: synchronic siblings - share a parent_id AND a tags value.
  const groups = new Map();
  csvRows.forEach(r => {
    if (isBlank(r.parent_id) || isBlank(r.tags)) return;
    const key = r.parent_id + "||" + r.tags;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r.id);
  });
  groups.forEach(ids => {
    for (let i = 0; i < ids.length; i++){
      for (let j = i + 1; j < ids.length; j++){
        addEdge(wordIdByCsvId.get(String(ids[i])), wordIdByCsvId.get(String(ids[j])), "CONNECTED_TO", false);
      }
    }
  });

  return { words, edges };
}

function renderTable(container, rows, columns){
  if (!rows.length){
    container.innerHTML = '<div class="empty-note">No rows produced from this CSV.</div>';
    return;
  }
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    columns.forEach(col => {
      const td = document.createElement("td");
      td.textContent = row[col] === undefined || row[col] === null ? "" : String(row[col]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  container.innerHTML = "";
  container.appendChild(table);
}

function build(rows){
  try{
    const { words, edges } = buildRelationalTables(rows);
    renderTable(document.getElementById("wordsTableWrap"), words,
      ["word_id", "node_type", "id", "word", "meaning", "category", "tags"]);
    renderTable(document.getElementById("edgesTableWrap"), edges,
      ["edge_id", "source_word_id", "target_word_id", "relationship_type", "is_diachronic"]);
    setStatus(`Built ${words.length} words / ${edges.length} edges.`, "ok");
  } catch(err){
    setStatus("Error: " + err.message, "error");
  }
}
</script>
</body>
</html>
